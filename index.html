<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Em Breve · Coming Soon</title>
<meta name="description" content="Algo novo está a chegar. Something new is coming.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070505;
    --fg:#f2f2ee;
    --muted:#9a8a8a;
    --acid:#ff1f2d;
    --pink:#9e0b14;
    --line:rgba(255,60,60,.14);
    --ember:#ff6b4a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"JetBrains Mono",ui-monospace,monospace;
    overflow:hidden;
    cursor:none;
    -webkit-font-smoothing:antialiased;
  }
  canvas#field{position:fixed;inset:0;width:100%;height:100%;z-index:0}

  /* glow blobs */
  .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;pointer-events:none;mix-blend-mode:screen}
  .blob.a{width:46vmax;height:46vmax;background:var(--acid);top:-18vmax;left:-12vmax;animation:drift 18s ease-in-out infinite alternate;opacity:.2}
  .blob.b{width:40vmax;height:40vmax;background:var(--pink);bottom:-20vmax;right:-10vmax;animation:drift 22s ease-in-out infinite alternate-reverse;opacity:.35}
  @keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

  /* grain */
  .grain{position:fixed;inset:-50%;z-index:5;pointer-events:none;opacity:.07;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1s steps(6) infinite}
  @keyframes grain{
    0%{transform:translate(0,0)}20%{transform:translate(-5%,3%)}40%{transform:translate(4%,-6%)}
    60%{transform:translate(-3%,5%)}80%{transform:translate(6%,2%)}100%{transform:translate(0,0)}}

  /* frame */
  .frame{position:fixed;inset:16px;border:1px solid var(--line);z-index:3;pointer-events:none}
  .frame i{position:absolute;width:12px;height:12px;border-color:var(--acid);border-style:solid}
  .frame i:nth-child(1){top:-1px;left:-1px;border-width:2px 0 0 2px}
  .frame i:nth-child(2){top:-1px;right:-1px;border-width:2px 2px 0 0}
  .frame i:nth-child(3){bottom:-1px;left:-1px;border-width:0 0 2px 2px}
  .frame i:nth-child(4){bottom:-1px;right:-1px;border-width:0 2px 2px 0}

  header,footer{pointer-events:none;position:fixed;left:16px;right:16px;z-index:4;display:flex;justify-content:space-between;align-items:center;
    padding:18px 22px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  header{top:16px} footer{bottom:16px}
  .pill{display:inline-flex;align-items:center;gap:10px;color:var(--fg)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--acid);box-shadow:0 0 12px var(--acid);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

  .lang{display:inline-flex;border:1px solid var(--line);pointer-events:auto}
  .lang button{all:unset;cursor:pointer;padding:6px 10px;font:inherit;letter-spacing:.18em;color:var(--muted);transition:background .2s,color .2s}
  .lang button[aria-pressed="true"]{background:var(--acid);color:#070505}
  .lang button:hover{color:var(--fg)}
  .lang button[aria-pressed="true"]:hover{color:#070505}
  h1.en{font-size:clamp(48px,11.5vw,200px)}
  main{position:relative;z-index:4;height:100%;display:grid;place-items:center;text-align:center;padding:0 24px}
  .kicker{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--acid);margin-bottom:2.2vh;
    opacity:0;animation:fadeUp .9s .2s cubic-bezier(.2,.8,.2,1) forwards}

  h1{
    font-family:"Unbounded",sans-serif;font-weight:900;
    font-size:clamp(56px,15vw,240px);line-height:.86;letter-spacing:-.04em;
    display:flex;flex-wrap:wrap;justify-content:center;gap:0 .18em;
    user-select:none;
  }
  h1 .word{display:inline-flex}
  h1 .ch{
    display:inline-block;position:relative;
    opacity:0;transform:translateY(60%) rotate(8deg);filter:blur(14px);
    animation:in 1.1s cubic-bezier(.16,1,.3,1) forwards;
    transition:transform .5s cubic-bezier(.34,1.8,.64,1),color .3s;
  }
  h1 .ch.lit{color:var(--acid);text-shadow:0 0 40px rgba(255,31,45,.6);transform:translateY(-14%) rotate(-6deg) scale(1.06)}
  h1 .word.outline .ch{color:transparent;-webkit-text-stroke:2px var(--fg)}
  h1 .word.outline .ch.lit{color:var(--acid);-webkit-text-stroke:0;text-shadow:0 0 40px rgba(255,31,45,.6)}
  @keyframes in{to{opacity:1;transform:none;filter:none}}

  /* glitch slices */
  h1.glitch{animation:shake .25s steps(2) 1}
  h1.glitch .ch{text-shadow:-5px 0 var(--acid),5px 0 rgba(255,255,255,.5)}
  @keyframes shake{0%{transform:translate(2px,-1px) skewX(-4deg)}50%{transform:translate(-3px,2px) skewX(3deg)}100%{transform:none}}

  .sub{margin:3.4vh auto 0;font-size:clamp(13px,1.3vw,16px);color:var(--muted);max-width:520px;line-height:1.7;
    opacity:0;animation:fadeUp .9s 1.3s cubic-bezier(.2,.8,.2,1) forwards}
  .sub b{color:var(--fg);font-weight:600}
  .typed::after{content:"_";color:var(--acid);animation:blink 1s steps(1) infinite;margin-left:2px}
  @keyframes blink{50%{opacity:0}}

  .bar{margin:4.5vh auto 0;width:min(340px,70vw);opacity:0;animation:fadeUp .9s 1.6s cubic-bezier(.2,.8,.2,1) forwards}
  .bar .track{height:3px;background:var(--line);position:relative;overflow:hidden}
  .bar .fill{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--pink),var(--acid),var(--ember));
    box-shadow:0 0 18px var(--acid);transition:width 1.8s cubic-bezier(.2,.8,.2,1)}
  .bar .meta{display:flex;justify-content:space-between;margin-top:10px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .bar .meta span:last-child{color:var(--fg)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* marquee */
  .marquee{position:fixed;left:0;right:0;bottom:78px;z-index:2;overflow:hidden;pointer-events:none;
    font-family:"Unbounded",sans-serif;font-weight:300;font-size:clamp(14px,1.6vw,20px);letter-spacing:.08em;
    color:rgba(255,255,255,.14);white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
  .marquee .track{display:inline-block;animation:scroll 38s linear infinite}
  .marquee em{font-style:normal;color:var(--acid);opacity:.7;margin:0 1.4em}
  @keyframes scroll{to{transform:translateX(-50%)}}

  /* cursor */
  .cursor{position:fixed;z-index:10;pointer-events:none;width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid var(--acid);
    border-radius:50%;transition:width .25s,height .25s,margin .25s,background .25s}
  .cursor.big{width:90px;height:90px;margin:-45px 0 0 -45px;background:rgba(255,31,45,.18);border-color:transparent;backdrop-filter:invert(1) hue-rotate(180deg)}
  .cursor-dot{position:fixed;z-index:10;pointer-events:none;width:4px;height:4px;margin:-2px 0 0 -2px;background:var(--fg);border-radius:50%}

  @media (hover:none){body{cursor:auto}.cursor,.cursor-dot{display:none}}
  @media (max-width:640px){
    header,footer{padding:14px 14px;font-size:9px;letter-spacing:.14em}
    .hide-sm{display:none}
    .marquee{bottom:64px}
    .frame{inset:10px}
    h1{flex-direction:column;align-items:center;font-size:26vw;line-height:.9}
    h1.en{font-size:19vw}
    header{top:10px} footer{bottom:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}
  }
</style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="blob a"></div><div class="blob b"></div>
  <div class="grain"></div>
  <div class="frame"><i></i><i></i><i></i><i></i></div>

  <header>
    <span class="pill"><span class="dot"></span><span data-i="status"></span></span>
    <span class="hide-sm"><span data-i="city"></span> <span id="clock">--:--:--</span></span>
    <span class="lang" role="group" aria-label="Idioma / Language"><button data-l="pt">PT</button><button data-l="en">EN</button></span>
  </header>

  <main>
    <div>
      <p class="kicker">✦ <span data-i="kicker"></span> ✦</p>
      <h1 id="title"></h1>
      <p class="sub"><span class="typed" id="typed"></span></p>
      <div class="bar" aria-hidden="true">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="meta"><span data-i="loading"></span><span id="pct">0%</span></div>
      </div>
    </div>
  </main>

  <div class="marquee" aria-hidden="true"><div class="track" id="mq"></div></div>

  <footer>
    <span>© <span id="yr"></span></span>
    <span class="hide-sm" data-i="back"></span>
    <span>v0.1 / beta</span>
  </footer>

  <div class="cursor" id="cur"></div><div class="cursor-dot" id="curd"></div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- i18n ---------- */
  const T = {
    pt:{ title:['EM','BREVE'], status:'Em construção', city:'Lisboa', kicker:'Algo novo está a chegar', loading:'A carregar ideias', back:'Volta em breve',
         lines:['Estamos a preparar uma coisa a sério.','Menos promessas. Mais lançamento.','Afina o radar. Falta pouco.','Café a postos. Código a compilar.'] },
    en:{ title:['COMING','SOON'], status:'Under construction', city:'Lisbon', kicker:'Something new is coming', loading:'Loading ideas', back:'Check back soon',
         lines:['We are cooking up something serious.','Fewer promises. More launch.','Keep your radar on. Almost there.','Coffee ready. Code compiling.'] }
  };
  let lang = 'pt';
  try { const saved = localStorage.getItem('lang'); if (saved && T[saved]) lang = saved; else if (!/^pt/i.test(navigator.language||'')) lang = 'en'; } catch(e){ if (!/^pt/i.test(navigator.language||'')) lang = 'en'; }

  /* ---------- title letters ---------- */
  const title = document.getElementById('title');
  let chars = [];
  const buildTitle = () => {
    title.innerHTML = '';
    title.classList.toggle('en', lang === 'en');
    title.setAttribute('aria-label', T[lang].title.join(' '));
    let delay = 0.1;
    T[lang].title.forEach((wd, i) => {
      const w = document.createElement('span');
      w.className = 'word' + (i ? ' outline' : '');
      [...wd].forEach(c => {
        const s = document.createElement('span');
        s.className = 'ch'; s.textContent = c; s.setAttribute('aria-hidden','true');
        s.style.animationDelay = delay + 's'; delay += 0.06;
        s.addEventListener('mouseenter', () => { s.classList.add('lit'); clearTimeout(s._t); s._t = setTimeout(() => s.classList.remove('lit'), 700); });
        w.appendChild(s);
      });
      title.appendChild(w);
    });
    chars = [...title.querySelectorAll('.ch')];
  };
  if (!reduce) {
    setInterval(() => {
      if (!chars.length) return;
      const c = chars[Math.floor(Math.random()*chars.length)];
      c.classList.add('lit'); setTimeout(() => c.classList.remove('lit'), 600);
    }, 1400);
    const glitch = () => {
      title.classList.add('glitch');
      setTimeout(() => title.classList.remove('glitch'), 260);
      setTimeout(glitch, 2500 + Math.random()*4500);
    };
    setTimeout(glitch, 3200);
  }

  /* ---------- typed line ---------- */
  const typed = document.getElementById('typed');
  let li = 0, pos = 0, dir = 1, typeTimer;
  const tick = () => {
    const lines = T[lang].lines, t = lines[li % lines.length];
    pos += dir;
    typed.textContent = t.slice(0, pos);
    let wait = dir > 0 ? 38 + Math.random()*40 : 18;
    if (dir > 0 && pos >= t.length) { dir = -1; wait = 2200; }
    else if (dir < 0 && pos <= 0) { dir = 1; li = (li+1) % lines.length; wait = 350; }
    typeTimer = setTimeout(tick, wait);
  };

  /* ---------- apply language ---------- */
  const apply = (first) => {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach(el => el.textContent = T[lang][el.dataset.i]);
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
    buildTitle();
    clearTimeout(typeTimer); li = 0; pos = 0; dir = 1;
    if (reduce) typed.textContent = T[lang].lines[0];
    else typeTimer = setTimeout(tick, first ? 1500 : 500);
  };
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.l === lang) return;
    lang = b.dataset.l;
    try { localStorage.setItem('lang', lang); } catch(e){}
    apply(false);
  }));
  apply(true);

  /* ---------- progress bar ---------- */
  const fill = document.getElementById('fill'), pct = document.getElementById('pct');
  const target = 87;
  setTimeout(() => {
    fill.style.width = target + '%';
    const start = performance.now();
    const step = now => {
      const k = Math.min(1, (now - start) / 1800);
      const e = 1 - Math.pow(1 - k, 3);
      pct.textContent = Math.round(e * target) + '%';
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, 1800);

  /* ---------- marquee ---------- */
  const words = ['em breve','coming soon','em breve','coming soon'];
  const chunk = words.map(w => `<span>${w}</span><em>✦</em>`).join('');
  document.getElementById('mq').innerHTML = chunk.repeat(4) + chunk.repeat(4);

  /* ---------- clock + year ---------- */
  const clock = document.getElementById('clock');
  const fmt = new Intl.DateTimeFormat('pt-PT',{timeZone:'Europe/Lisbon',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const upd = () => clock.textContent = fmt.format(new Date());
  upd(); setInterval(upd, 1000);
  document.getElementById('yr').textContent = new Date().getFullYear();

  /* ---------- cursor ---------- */
  const cur = document.getElementById('cur'), curd = document.getElementById('curd');
  let mx = innerWidth/2, my = innerHeight/2, cx = mx, cy = my, mouseActive = false;
  addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY; mouseActive = true;
    curd.style.transform = `translate(${mx}px,${my}px)`;
  });
  addEventListener('pointerleave', () => mouseActive = false);
  title.addEventListener('mouseenter', () => cur.classList.add('big'));
  title.addEventListener('mouseleave', () => cur.classList.remove('big'));
  (function follow(){
    cx += (mx - cx) * .18; cy += (my - cy) * .18;
    cur.style.transform = `translate(${cx}px,${cy}px)`;
    requestAnimationFrame(follow);
  })();
  curd.style.left = cur.style.left = '0px';
  curd.style.top = cur.style.top = '0px';

  /* ---------- flow field particles ---------- */
  const cv = document.getElementById('field'), ctx = cv.getContext('2d');
  let W, H, dpr, parts = [];
  const resize = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    ctx.fillStyle = '#070505'; ctx.fillRect(0,0,W,H);
    const n = Math.min(1400, Math.floor(innerWidth * innerHeight / 1100));
    parts = Array.from({length:n}, () => spawn());
  };
  const spawn = () => ({
    x: Math.random()*W, y: Math.random()*H,
    vx: 0, vy: 0, life: 60 + Math.random()*240,
    hue: Math.random() < .55 ? 0 : (Math.random() < .55 ? 1 : 2)
  });
  const cols = ['rgba(255,235,230,.35)','rgba(255,31,45,.95)','rgba(158,11,20,.95)'];
  let t = 0;
  const angle = (x, y) => {
    const s = 0.0016 / dpr;
    return Math.sin(x*s + t) * 1.7 + Math.cos(y*s*1.3 - t*.8) * 1.7 + Math.sin((x+y)*s*.5 + t*.5);
  };
  const frame = () => {
    t += 0.0035;
    ctx.fillStyle = 'rgba(7,5,5,0.085)';
    ctx.fillRect(0,0,W,H);
    const mX = mx*dpr, mY = my*dpr, R = 160*dpr;
    for (const p of parts) {
      const a = angle(p.x, p.y);
      p.vx += Math.cos(a) * .22 * dpr; p.vy += Math.sin(a) * .22 * dpr;
      if (mouseActive) {
        const dx = p.x - mX, dy = p.y - mY, d2 = dx*dx + dy*dy;
        if (d2 < R*R) { const f = (1 - Math.sqrt(d2)/R) * 2.4 * dpr; const d = Math.sqrt(d2)||1; p.vx += dx/d*f; p.vy += dy/d*f; }
      }
      p.vx *= .9; p.vy *= .9;
      const ox = p.x, oy = p.y;
      p.x += p.vx; p.y += p.vy; p.life--;
      ctx.strokeStyle = cols[p.hue];
      ctx.lineWidth = (p.hue ? 1.3 : .8) * dpr;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(p.x, p.y); ctx.stroke();
      if (p.life < 0 || p.x < 0 || p.x > W || p.y < 0 || p.y > H) Object.assign(p, spawn());
    }
    requestAnimationFrame(frame);
  };
  addEventListener('resize', resize);
  resize();
  frame();
})();
</script>
</body>
</html>
